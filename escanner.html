<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Acceso - C.E. Guaicaipuro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-gray-100 min-h-screen flex flex-col justify-between">

  <!-- HEADER SIMPLIFICADO -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 text-center">
    <h1 class="text-xl font-bold text-blue-400 uppercase tracking-wider">C.E. GUAICAIPURO</h1>
    <p class="text-xs text-gray-400">Punto de Control de Acceso Institucional</p>
  </header>

  <main class="max-w-md w-full mx-auto p-4 space-y-6 flex-1 flex flex-col justify-center">

    <!-- LECTOR QR DE CÁMARA -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-2xl flex flex-col items-center">
      <div id="reader" class="w-full rounded-xl overflow-hidden bg-black border border-slate-800" style="min-height: 250px;"></div>

      <div class="mt-4 flex gap-3 w-full">
        <button id="btnStartScan" onclick="startScanner()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition text-sm">
          📷 Iniciar Cámara
        </button>
        <button id="btnStopScan" onclick="stopScanner()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-gray-300 font-bold py-3 px-4 rounded-xl shadow-lg transition text-sm hidden">
          ⏹️ Detener
        </button>
      </div>
    </div>

    <!-- TARJETA DE VERIFICACIÓN / RESULTADO -->
    <div id="scanResultCard" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center shadow-xl">
      <span class="inline-block bg-slate-800 text-gray-400 text-xs px-3 py-1 rounded-full font-semibold">ESPERANDO LECTURA</span>
      <p class="text-gray-500 text-sm mt-3">Apunta la cámara al código QR del carnet para verificar al integrante.</p>
    </div>

  </main>

  <footer class="p-4 text-center text-[10px] text-gray-600 border-t border-slate-900">
    Sistema Institucional de Control de Asistencia • C.E. Guaicaipuro
  </footer>

  <script>
    const SUPABASE_URL = 'https://dampbjspktpcffqpuiuz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_raLpaXN3c1UpS4mHFvWkTQ_YNbtB3Q5';
    
    let supabaseClient = null;
    try {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch(err) {
      console.error("Error iniciando Supabase:", err);
    }

    let html5QrcodeScanner = null;

    function startScanner() {
      html5QrcodeScanner = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 220, height: 220 } };

      html5QrcodeScanner.start(
        { facingMode: "environment" },
        config,
        onScanSuccess,
        onScanFailure
      ).then(() => {
        document.getElementById('btnStartScan').classList.add('hidden');
        document.getElementById('btnStopScan').classList.remove('hidden');
      }).catch(err => {
        alert("No se pudo acceder a la cámara: " + err);
      });
    }

    function stopScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          document.getElementById('btnStartScan').classList.remove('hidden');
          document.getElementById('btnStopScan').classList.add('hidden');
        });
      }
    }

    async function onScanSuccess(decodedText) {
      const params = {};
      decodedText.split('|').forEach(part => {
        const [key, value] = part.split(':');
        if (key && value) params[key.trim()] = value.trim();
      });

      const cedula = params['CEDULA'] || decodedText;
      const nombre = params['NOMBRE'] || 'Integrante Registrado';
      const rol = params['ROL'] || 'General';

      const resultCard = document.getElementById('scanResultCard');
      
      // Feedback visual verde e informativo inmediato
      resultCard.innerHTML = `
        <div class="bg-emerald-950/80 border border-emerald-500/50 rounded-xl p-4">
          <span class="inline-block bg-emerald-500 text-slate-950 text-xs px-3 py-1 rounded-full font-extrabold uppercase mb-2">✅ ACCESO VERIFICADO</span>
          <h3 class="text-xl font-bold text-white leading-tight">${nombre}</h3>
          <p class="text-sm font-semibold text-yellow-400 mt-1">C.I: ${cedula}</p>
          <p class="text-xs text-emerald-300 font-bold uppercase mt-1">Rol: ${rol}</p>
          <p class="text-[10px] text-gray-400 mt-3 border-t border-emerald-900/60 pt-2">Hora de Entrada: ${new Date().toLocaleTimeString()}</p>
        </div>
      `;
    }

    function onScanFailure(error) {
      // Búsqueda continua en silencio
    }
  </script>
</body>
</html>
