<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro y Carnetización - C.E. Guaicaipuro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

  <!-- HEADER INSTITUCIONAL CON LOGO DME -->
  <header class="bg-slate-950 text-white py-4 px-6 shadow-xl border-b border-blue-900/60 flex flex-col sm:flex-row justify-between items-center gap-4">
    <div class="flex items-center gap-4">
      <img src="logo-dme.png" alt="Inversiones DME" class="h-12 w-auto object-contain rounded-full border border-yellow-500/50 shadow-md">
      <div>
        <h1 class="text-xl md:text-2xl font-extrabold text-blue-400 tracking-wide">C.E. GUAICAIPURO</h1>
        <p class="text-gray-400 text-xs">Sistema de Registro y Carnetización Institucional</p>
      </div>
    </div>
    
    <!-- NAVEGACIÓN AL ESCÁNER -->
    <a href="escanner.html" class="bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white text-xs font-bold py-2.5 px-5 rounded-xl shadow-lg transition duration-200 border border-cyan-400/30 flex items-center gap-2">
      <i class="fa-solid fa-qrcode"></i> Ir al Escáner y Métricas ➔
    </a>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="container mx-auto px-4 py-8 flex-grow">
    <div class="max-w-4xl mx-auto bg-slate-800/80 border border-slate-700 rounded-2xl shadow-2xl p-6 md:p-8 backdrop-blur-sm">
      <h2 class="text-xl font-bold text-white mb-6 border-b border-slate-700 pb-3 flex items-center gap-2">
        <i class="fa-solid fa-user-plus text-blue-400"></i> Registro de Estudiante
      </h2>

      <form id="studentForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-medium text-gray-300 mb-1">Nombres</label>
          <input type="text" id="nombres" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-300 mb-1">Apellidos</label>
          <input type="text" id="apellidos" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-300 mb-1">Cédula / Identificación</label>
          <input type="text" id="cedula" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-300 mb-1">Género</label>
          <select id="genero" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
            <option value="">Seleccione...</option>
            <option value="Masculino">Masculino</option>
            <option value="Femenino">Femenino</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-300 mb-1">Grado</label>
          <select id="grado" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
            <option value="">Seleccione...</option>
            <option value="1er Año">1er Año</option>
            <option value="2do Año">2do Año</option>
            <option value="3er Año">3er Año</option>
            <option value="4to Año">4to Año</option>
            <option value="5to Año">5to Año</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-300 mb-1">Sección</label>
          <select id="seccion" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
            <option value="">Seleccione...</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
          </select>
        </div>

        <div class="md:col-span-2 mt-4">
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg transition">
            Guardar Registro y Generar Carnet
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- FOOTER MARCA REGISTRADA DME -->
  <footer class="bg-slate-950 text-gray-400 text-center py-4 px-4 text-xs border-t border-slate-900 flex flex-col sm:flex-row justify-center items-center gap-2">
    <p>© 2026 C.E. Guaicaipuro. Todos los derechos reservados.</p>
    <span class="hidden sm:inline text-gray-600">|</span>
    <p class="flex items-center gap-1.5 font-semibold text-gray-300">
      Desarrollado por <span class="text-cyan-400">Inversiones DME</span> - Tecnología y Futuro
    </p>
  </footer>

</body>
</html>
