<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C.E. Guaicaipuro - Inscripción y Registro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.net/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-gray-100 min-h-screen pb-12">

  <!-- CABECERA DE NAVEGACIÓN -->
  <header class="bg-slate-950 border-b border-blue-900/40 py-5 px-6 sticky top-0 z-50 backdrop-blur-md bg-opacity-90">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/20">
          <span class="text-xl">🏫</span>
        </div>
        <div>
          <h1 class="text-base font-extrabold text-white tracking-wide">C.E. GUAICAIPURO</h1>
          <p class="text-[10px] text-blue-400 font-medium">Control Escolar Digital</p>
        </div>
      </div>
      
      <!-- NAVEGACIÓN PRINCIPAL -->
      <nav class="flex items-center gap-2">
        <a href="index.html" class="bg-blue-600/20 text-blue-300 border border-blue-500/30 text-xs font-semibold py-2 px-3.5 rounded-xl transition hover:bg-blue-600/30 flex items-center gap-1.5">
          <span>📝</span> Inscripción
        </a>
        <a href="escanner.html" class="bg-slate-900 text-gray-300 border border-slate-700/80 text-xs font-semibold py-2 px-3.5 rounded-xl transition hover:bg-slate-800 hover:text-white flex items-center gap-1.5">
          <span>📷</span> Escáner QR
        </a>
        <a href="docentes.html" class="bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 text-xs font-semibold py-2 px-3.5 rounded-xl transition hover:bg-indigo-600/30 flex items-center gap-1.5">
          <span>👨‍🏫</span> Asistencia Materia / Notas
        </a>
        <a href="metricas.html" class="bg-emerald-600/20 text-emerald-300 border border-emerald-500/30 text-xs font-semibold py-2 px-3.5 rounded-xl transition hover:bg-emerald-600/30 flex items-center gap-1.5">
          <span>📊</span> Métricas
        </a>
      </nav>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-4xl mx-auto mt-8 px-4">
    <div class="bg-slate-900/80 border border-slate-800 p-6 md:p-8 rounded-3xl shadow-2xl backdrop-blur-sm">
      <div class="mb-6 border-b border-slate-800 pb-4">
        <h2 class="text-xl font-bold text-white flex items-center gap-2">
          <span>📋</span> Registro de Alumnos
        </h2>
        <p class="text-xs text-gray-400 mt-1">Ingrese los datos para registrar al estudiante y generar su carnet digital.</p>
      </div>

      <form id="formRegistro" onsubmit="registrarAlumno(event)" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Nombres y Apellidos</label>
            <input type="text" id="nombre" required placeholder="Ej: Juan Pérez" class="w-full bg-slate-950 border border-slate-800 text-white rounded-xl py-2.5 px-3 focus:outline-none focus:border-blue-500 transition text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Cédula / Identificación</label>
            <input type="text" id="cedula" required placeholder="Ej: V-30123456" class="w-full bg-slate-950 border border-slate-800 text-white rounded-xl py-2.5 px-3 focus:outline-none focus:border-blue-500 transition text-sm">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Grado / Año</label>
            <select id="grado" required class="w-full bg-slate-950 border border-slate-800 text-white rounded-xl py-2.5 px-3 focus:outline-none focus:border-blue-500 transition text-sm">
              <option value="">Seleccione Grado</option>
              <option value="1er Año">1er Año</option>
              <option value="2do Año">2do Año</option>
              <option value="3er Año">3er Año</option>
              <option value="4to Año">4to Año</option>
              <option value="5to Año">5to Año</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Sección</label>
            <select id="seccion" required class="w-full bg-slate-950 border border-slate-800 text-white rounded-xl py-2.5 px-3 focus:outline-none focus:border-blue-500 transition text-sm">
              <option value="">Seleccione Sección</option>
              <option value="A">A</option>
              <option value="B">B</option>
              <option value="C">C</option>
              <option value="D">D</option>
              <option value="E">E</option>
              <option value="F">F</option>
              <option value="G">G</option>
              <option value="H">H</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Representante / Teléfono Contacto</label>
          <input type="text" id="contacto" placeholder="Ej: Maria Pérez - 04121234567" class="w-full bg-slate-950 border border-slate-800 text-white rounded-xl py-2.5 px-3 focus:outline-none focus:border-blue-500 transition text-sm">
        </div>

        <button type="submit" id="btnGuardar" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-blue-600/30 transition text-sm flex items-center justify-center gap-2">
          <span>💾</span> Registrar Estudiante y Generar Carnet
        </button>
      </form>

      <!-- VISTA PREVIA DEL CARNET Y QR GENERADO -->
      <div id="seccionCarnet" class="hidden mt-8 border-t border-slate-800 pt-6">
        <h3 class="text-center font-bold text-gray-300 text-sm mb-4">Carnet Digital Generado</h3>
        <div class="max-w-xs mx-auto bg-slate-950 border border-blue-500/40 rounded-2xl p-5 text-center shadow-2xl relative overflow-hidden">
          <div class="absolute -top-12 -right-12 w-24 h-24 bg-blue-500/10 rounded-full blur-xl"></div>
          <h4 class="text-xs font-extrabold text-blue-400 uppercase tracking-widest mb-1">C.E. Guaicaipuro</h4>
          <p class="text-[10px] text-gray-400 mb-4">Carnet Estudiantil Digital</p>
          
          <div id="qrcode" class="flex justify-center p-3 bg-white rounded-xl w-fit mx-auto shadow-inner my-2"></div>
          
          <p id="carnetNombre" class="font-bold text-white text-sm mt-3"></p>
          <p id="carnetCedula" class="text-xs text-amber-400 font-semibold"></p>
          <p id="carnetDetalle" class="text-xs text-gray-400 mt-1"></p>
        </div>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://dampbjspktpcffqpuiuz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_raLpaXN3c1UpS4mHFvWkTQ_YNbtB3Q5';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function registrarAlumno(event) {
      event.preventDefault();
      const btn = document.getElementById('btnGuardar');
      btn.disabled = true;
      btn.innerText = 'Guardando...';

      const nombre = document.getElementById('nombre').value;
      const cedula = document.getElementById('cedula').value;
      const grado = document.getElementById('grado').value;
      const seccion = document.getElementById('seccion').value;
      const contacto = document.getElementById('contacto').value;

      const { data, error } = await supabaseClient
        .from('alumnos')
        .insert([{ 
          nombre_apellido: nombre, 
          cedula: cedula, 
          grado: grado, 
          seccion: seccion,
          contacto: contacto
        }]);

      if (error) {
        alert("Error al guardar en Supabase: " + error.message);
        btn.disabled = false;
        btn.innerText = '💾 Registrar Estudiante y Generar Carnet';
        return;
      }

      // Mostrar Carnet
      document.getElementById('carnetNombre').innerText = nombre;
      document.getElementById('carnetCedula').innerText = `C.I: ${cedula}`;
      document.getElementById('carnetDetalle').innerText = `${grado} - Sección "${seccion}"`;

      // Generar Código QR con la Cédula
      const qrcodeContainer = document.getElementById('qrcode');
      qrcodeContainer.innerHTML = "";
      new QRCode(qrcodeContainer, {
        text: cedula,
        width: 128,
        height: 128
      });

      document.getElementById('seccionCarnet').classList.remove('hidden');
      btn.disabled = false;
      btn.innerText = '💾 Registrar Estudiante y Generar Carnet';
      document.getElementById('formRegistro').reset();
    }
  </script>
</body>
</html>
