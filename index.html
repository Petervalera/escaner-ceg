<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema - C.E. Guaicaipuro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
    
    body { 
      font-family: 'Inter', sans-serif;
      background-color: #0f172a; /* Slate 900 */
    }
    
    /* MARCA DE AGUA EN EL FONDO */
    .bg-watermark {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80vw;
      max-width: 500px;
      height: auto;
      opacity: 0.05;
      pointer-events: none;
      z-index: 0;
      filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.2));
    }

    /* ANIMACIÓN CORPORATIVA DE ENTRADA */
    .corporate-entrance {
      animation: entranceAnimation 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes entranceAnimation {
      0% {
        opacity: 0;
        transform: scale(0.92) translateY(20px);
        filter: blur(10px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0);
      }
    }

    /* EFECTO GLOW PARA EL BOTÓN Y TARJETA */
    .glass-card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .btn-glow {
      box-shadow: 0 0 20px rgba(37, 99, 235, 0.4);
    }
    .btn-glow:hover {
      box-shadow: 0 0 30px rgba(37, 99, 235, 0.7);
    }
  </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col justify-between p-4 relative overflow-hidden select-none">

  <!-- 1. LOGO EN MARCA DE AGUA CORPORATIVA -->
  <img id="watermarkImg" src="logo_ce_guaicaipuro.png" alt="Insignia Institucional" class="bg-watermark" onerror="this.style.display='none'">

  <!-- CONTENEDOR PRINCIPAL CON ANIMACIÓN -->
  <div class="max-w-md w-full mx-auto my-auto z-10 space-y-6 corporate-entrance">
    
    <!-- ENCABEZADO CON LOGO INSTITUCIONAL -->
    <header class="text-center space-y-3">
      <div class="w-24 h-24 bg-slate-800/90 rounded-3xl border border-slate-700/80 flex items-center justify-center mx-auto shadow-2xl p-3 relative group">
        <div class="absolute -inset-0.5 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-3xl blur opacity-30 group-hover:opacity-100 transition duration-1000"></div>
        <img id="logoHeader" src="logo_ce_guaicaipuro.png" alt="Logo Colegio" class="w-full h-full object-contain relative z-10" onerror="this.src='https://cdn-icons-png.flaticon.com/512/167/167707.png'">
      </div>
      
      <div>
        <h1 id="tituloInstitucion" class="text-2xl font-black text-white tracking-wider uppercase">C.E. GUAICAIPURO</h1>
        <p class="text-xs text-blue-400 font-extrabold uppercase tracking-widest mt-1">Control de Asistencia e Identificación Digital</p>
      </div>
    </header>

    <!-- 2. FORMULARIO DE SOLICITUD DE CÉDULA Y CONTRASEÑA -->
    <main class="glass-card rounded-3xl p-6 sm:p-8 space-y-6 relative overflow-hidden">
      
      <div class="border-b border-slate-700/80 pb-4 text-center">
        <h2 class="text-lg font-bold text-white tracking-wide">Acceso al Sistema</h2>
        <p class="text-xs text-gray-400">Ingrese sus datos para validar su identidad</p>
      </div>

      <form id="loginForm" onsubmit="procesarLogin(event)" class="space-y-5">
        
        <!-- CÉDULA DE IDENTIDAD -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-2 flex items-center gap-1.5">
            <span>🪪</span> Cédula de Identidad
          </label>
          <input type="text" id="cedula" required placeholder="Ej: 12345678" class="w-full bg-slate-900/90 border border-slate-700 text-white rounded-xl px-4 py-3.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition">
        </div>

        <!-- CONTRASEÑA -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-2 flex items-center gap-1.5">
            <span>🔑</span> Contraseña
          </label>
          <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-900/90 border border-slate-700 text-white rounded-xl px-4 py-3.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition">
        </div>

        <!-- BOTÓN DE INGRESO -->
        <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl shadow-lg border border-blue-400/30 transition duration-300 text-sm flex justify-center items-center gap-2 cursor-pointer btn-glow tracking-wide">
          <span>🚀</span> INGRESAR AL SISTEMA
        </button>

      </form>

      <!-- MENSAJE DE ERROR -->
      <div id="mensajeError" class="hidden text-center text-xs font-bold text-red-400 bg-red-950/60 border border-red-700/60 p-3 rounded-xl animate-pulse"></div>

      <!-- ENLACE A REGISTRO -->
      <div class="text-center pt-2 border-t border-slate-700/80">
        <p class="text-xs text-gray-400">
          ¿Aún no te has registrado? 
          <a href="./registro.html" class="text-blue-400 font-bold hover:text-blue-300 underline transition">Registrarse aquí</a>
        </p>
      </div>

    </main>

  </div>

  <!-- PIE DE PÁGINA CORPORATIVO -->
  <footer class="z-10 text-center py-3 w-full border-t border-slate-800/80 bg-slate-900/80 backdrop-blur-sm mt-4">
    <p class="text-xs font-semibold text-gray-400 tracking-wider">
      Desarrollado por <span class="text-blue-400 font-extrabold">DME Technology</span>
    </p>
  </footer>

  <!-- LÓGICA CONEXIÓN Y PERSISTENCIA -->
  <script>
    const SUPABASE_URL = 'https://dampbjspktpcffqpuiuz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_raLpaXN3c1UpS4mHFvWkTQ_YNbtB3Q5';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // VERIFICACIÓN AUTOMÁTICA DE SESIÓN PREVIA Y CARGA DE INSTITUCIÓN
    window.onload = function() {
      // 1. Si el usuario YA inició sesión anteriormente y no ha cerrado sesión, redirigir al panel
      const usuarioActivo = JSON.parse(localStorage.getItem('currentUser'));
      if (usuarioActivo) {
        window.location.href = "./panel.html";
        return;
      }

      // 2. Cargar branding institucional si fue guardado
      const nombreGuardado = localStorage.getItem('nombre_institucion');
      const logoGuardado = localStorage.getItem('logo_institucion');

      if (nombreGuardado) {
        document.getElementById('tituloInstitucion').textContent = nombreGuardado;
      }
      if (logoGuardado) {
        document.getElementById('logoHeader').src = logoGuardado;
        document.getElementById('watermarkImg').src = logoGuardado;
      }
    };

    // PROCESAR INICIO DE SESIÓN CON TABLA REGISTRO_GENERAL
    async function procesarLogin(event) {
      event.preventDefault();

      const cedulaInput = document.getElementById('cedula').value.trim();
      const passwordInput = document.getElementById('password').value.trim();
      const msgError = document.getElementById('mensajeError');
      const submitBtn = document.getElementById('submitBtn');

      msgError.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verificando...';

      try {
        const { data, error } = await supabaseClient
          .from('registro_general')
          .select('*')
          .eq('cedula', cedulaInput)
          .maybeSingle();

        if (error) throw error;

        if (!data) {
          throw new Error('La cédula ingresada no se encuentra registrada.');
        }

        if (!data.clave) {
          throw new Error('Su perfil no tiene una contraseña asignada para acceso al sistema.');
        }

        if (data.clave !== passwordInput) {
          throw new Error('Contraseña incorrecta.');
        }

        // GUARDAR DATOS DE SESIÓN ACTIVA
        const usuarioSesion = {
          cedula: data.cedula,
          nombre_apellido: data.nombre_apellido,
          rol: data.rol,
          telefono: data.telefono
        };
        localStorage.setItem('currentUser', JSON.stringify(usuarioSesion));

        // REDIRIGIR AL PANEL PRINCIPAL
        window.location.href = "./panel.html";

      } catch (err) {
        msgError.textContent = err.message;
        msgError.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>🚀</span> INGRESAR AL SISTEMA';
      }
    }
  </script>

</body>
</html>
