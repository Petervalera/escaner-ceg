<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Institucional - C.E. Guaicaipuro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen pb-12">

  <!-- HEADER NAVEGACIÓN -->
  <header class="bg-slate-950 text-white py-6 px-6 shadow-xl border-b border-blue-900 flex flex-col md:flex-row justify-between items-center gap-4">
    <div class="text-center md:text-left">
      <h1 class="text-2xl md:text-3xl font-extrabold text-blue-400">C.E. GUAICAIPURO</h1>
      <p class="text-gray-400 text-sm md:text-base mt-1">Sistema de Registro General de Personal y Estudiantes</p>
    </div>

    <!-- BOTONES DE NAVEGACIÓN -->
    <div class="flex flex-wrap justify-center md:justify-end gap-2">
      <a href="index.html" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-3 rounded-xl shadow-lg border border-blue-400/30 text-xs flex items-center gap-1.5 transition duration-200 ring-2 ring-blue-400">
        📝 Registro
      </a>
      <a href="escanner.html" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 px-3 rounded-xl shadow-lg border border-cyan-400/30 text-xs flex items-center gap-1.5 transition duration-200">
        📷 Escáner
      </a>
      <a href="metricas.html" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-3 rounded-xl shadow-lg border border-emerald-400/30 text-xs flex items-center gap-1.5 transition duration-200">
        📊 Métricas
      </a>
      <a href="asistencia_materia.html" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-3 rounded-xl shadow-lg border border-indigo-400/30 text-xs flex items-center gap-1.5 transition duration-200">
        👨‍🏫 Asistencia / Notas
      </a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto mt-8 px-4">

    <!-- FORMULARIO DE REGISTRO GENERAL -->
    <section class="bg-slate-800 p-6 md:p-8 rounded-xl shadow-2xl border border-slate-700 space-y-6">
      <h2 class="text-xl md:text-2xl font-bold text-white border-b border-slate-700 pb-3 flex items-center gap-2">
        <span>👤</span> Registro General de Personal / Estudiante
      </h2>

      <div id="alertBox" class="hidden p-3 rounded text-sm font-semibold"></div>

      <form id="formRegistro" onsubmit="registrarPersona(event)" class="space-y-4">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Cédula -->
          <div>
            <label class="block text-xs font-bold uppercase text-gray-300 mb-1">Cédula de Identidad</label>
            <input type="text" id="cedula" required placeholder="Ej: V-12345678" class="w-full bg-slate-900 border border-slate-700 text-white rounded px-3 py-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>

          <!-- Nombre y Apellido -->
          <div>
            <label class="block text-xs font-bold uppercase text-gray-300 mb-1">Nombre y Apellido</label>
            <input type="text" id="nombreApellido" required placeholder="Ej: Juan Pérez" class="w-full bg-slate-900 border border-slate-700 text-white rounded px-3 py-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Rol / Tipo de Usuario -->
          <div>
            <label class="block text-xs font-bold uppercase text-gray-300 mb-1">Rol / Función en el Plantel</label>
            <select id="rol" onchange="toggleCamposEstudiante()" required class="w-full bg-slate-900 border border-slate-700 text-white rounded px-3 py-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <option value="">Seleccione Rol</option>
              <option value="Estudiante">Estudiante</option>
              <option value="Docente">Docente</option>
              <option value="Administrative">Administrativo</option>
              <option value="Directivo">Directivo</option>
              <option value="Obrero">Obrero</option>
              <option value="Cocinera">Cocinera / Madres Procesadoras</option>
              <option value="Vigilante">Vigilante / Seguridad</option>
            </select>
          </div>

          <!-- Teléfono -->
          <div>
            <label class="block text-xs font-bold uppercase text-gray-300 mb-1">Teléfono de Contacto</label>
            <input type="text" id="telefono" placeholder="Ej: 0412-1234567" class="w-full bg-slate-900 border border-slate-700 text-white rounded px-3 py-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>

        <!-- CAMPOS EXCLUSIVOS PARA ESTUDIANTES -->
        <div id="seccionEstudiante" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4 p-4 bg-slate-900 rounded-lg border border-slate-700/50">
          <div>
            <label class="block text-xs font-bold uppercase text-gray-300 mb-1">Grado / Año</label>
            <select id="grado" class="w-full bg-slate-800 border border-slate-700 text-white rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <option value="">Seleccione Año</option>
              <option value="1er Año">1er Año</option>
              <option value="2do Año">2do Año</option>
              <option value="3er Año">3er Año</option>
              <option value="4to Año">4to Año</option>
              <option value="5to Año">5to Año</option>
              <option value="6to Año">6to Año</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase text-gray-300 mb-1">Sección</label>
            <select id="seccion" class="w-full bg-slate-800 border border-slate-700 text-white rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <option value="">Seleccione Sección</option>
              <option value="A">A</option>
              <option value="B">B</option>
              <option value="C">C</option>
              <option value="D">D</option>
              <option value="E">E</option>
              <option value="F">F</option>
            </select>
          </div>
        </div>

        <button type="submit" id="btnGuardar" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg shadow-lg border border-blue-400/30 transition duration-200 text-sm flex justify-center items-center gap-2">
          💾 Registrar en Base de Datos
        </button>

      </form>
    </section>

  </main>

  <script>
    const SUPABASE_URL = 'https://dampbjspktpcffqpuiuz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_raLpaXN3c1UpS4mHFvWkTQ_YNbtB3Q5';
    
    let supabaseClient = null;
    try {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch(err) {
      console.error("Error iniciando Supabase:", err);
    }

    function showAlert(msg, isError = false) {
      const box = document.getElementById('alertBox');
      box.textContent = msg;
      box.className = `p-3 rounded text-sm font-semibold ${isError ? 'bg-red-900/80 text-red-200 border border-red-700' : 'bg-green-900/80 text-green-200 border border-green-700'}`;
      box.classList.remove('hidden');
    }

    function toggleCamposEstudiante() {
      const rol = document.getElementById('rol').value;
      const seccionEstudiante = document.getElementById('seccionEstudiante');
      
      if (rol === 'Estudiante') {
        seccionEstudiante.classList.remove('hidden');
      } else {
        seccionEstudiante.classList.add('hidden');
        document.getElementById('grado').value = '';
        document.getElementById('seccion').value = '';
      }
    }

    async function registrarPersona(event) {
      event.preventDefault();

      const cedula = document.getElementById('cedula').value.trim();
      const nombreApellido = document.getElementById('nombreApellido').value.trim();
      const rol = document.getElementById('rol').value;
      const telefono = document.getElementById('telefono').value.trim();
      const grado = document.getElementById('grado').value;
      const seccion = document.getElementById('seccion').value;

      if (!cedula || !nombreApellido || !rol) {
        return showAlert("⚠️ Por favor complete los campos obligatorios.", true);
      }

      if (rol === 'Estudiante' && (!grado || !seccion)) {
        return showAlert("⚠️ Para los estudiantes debe seleccionar Grado y Sección.", true);
      }

      const registro = {
        cedula: cedula,
        nombre_apellido: nombreApellido,
        rol: rol,
        telefono: telefono || null,
        grado: rol === 'Estudiante' ? grado : null,
        seccion: rol === 'Estudiante' ? seccion : null
      };

      try {
        // Guardar directamente en la tabla `registro_general`
        const { data, error } = await supabaseClient
          .from('registro_general')
          .insert([registro]);

        if (error) throw error;

        showAlert(`✅ ${nombreApellido} (${rol}) registrado con éxito en 'registro_general'.`);
        document.getElementById('formRegistro').reset();
        toggleCamposEstudiante();

      } catch (err) {
        console.error("Error al registrar en Supabase:", err);
        showAlert(`⚠️ Error al guardar el registro: ${err.message}`, true);
      }
    }
  </script>
</body>
</html>
