<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Control e Inscripción - C.E. Guaicaipuro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    
    .bg-watermark {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70vw;
      max-width: 500px;
      height: auto;
      opacity: 0.05;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body class="bg-slate-900 text-gray-100 min-h-screen flex flex-col justify-between p-4 relative overflow-x-hidden">

  <!-- MARCA DE AGUA INSTITUCIONAL -->
  <img src="logo_ce_guaicaipuro.png" alt="Insignia C.E. Guaicaipuro" class="bg-watermark" onerror="this.style.display='none'">

  <div class="max-w-4xl w-full mx-auto z-10 space-y-6 my-4">
    
    <!-- ENCABEZADO PRINCIPAL -->
    <header class="bg-slate-800/90 backdrop-blur-md rounded-2xl border border-slate-700/80 p-6 shadow-xl text-center space-y-2">
      <div class="w-16 h-16 bg-blue-600/20 text-blue-400 rounded-2xl border border-blue-500/30 flex items-center justify-center mx-auto shadow-inner mb-2">
        <img src="logo_ce_guaicaipuro.png" alt="Logo" class="w-12 h-12 object-contain" onerror="this.src='https://cdn-icons-png.flaticon.com/512/167/167707.png'">
      </div>
      <h1 class="text-3xl font-extrabold text-white tracking-tight">C.E. GUAICAIPURO</h1>
      <p class="text-xs text-blue-400 font-bold uppercase tracking-wider">Módulo Maestro de Registro e Inscripción Institucional</p>
    </header>

    <!-- TARJETA DEL FORMULARIO -->
    <main class="bg-slate-800/90 backdrop-blur-md rounded-2xl border border-slate-700/80 p-6 sm:p-8 shadow-2xl space-y-6">
      
      <form id="formRegistro" onsubmit="guardarRegistro(event)" class="space-y-5">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          
          <!-- TIPO DE USUARIO / ROL -->
          <div>
            <label class="block text-xs font-bold uppercase text-gray-300 mb-1.5 flex items-center gap-1">
              <span>🛡️</span> Rol Institucional
            </label>
            <select id="rol" onchange="evaluarRol(this.value)" required class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none transition cursor-pointer">
              <option value="" disabled selected>Seleccione el rol correspondiente</option>
              <option value="ESTUDIANTE">🎓 Estudiante / Alumno</option>
              <option value="DOCENTE">👨‍🏫 Docente / Profesor</option>
              <option value="DIRECTIVO">🏛️ Directivo</option>
              <option value="EVALUACION">📊 Control de Evaluación</option>
              <option value="ADMINISTRATIVO">📋 Personal Administrativo</option>
              <option value="PORTERIA">📷 Portería / Escáner</option>
              <option value="COCINA">🧑‍🍳 Personal de Cocina</option>
              <option value="OBRERO">🧹 Personal Obrero</option>
              <option value="SUPER_ADMIN">👑 Super Admin (DME Tech)</option>
            </select>
          </div>

          <!-- CÉDULA -->
          <div>
            <label class="block text-xs font-bold uppercase text-gray-300 mb-1.5 flex items-center gap-1">
              <span>🪪</span> Cédula de Identidad
            </label>
            <input type="text" id="cedula" required placeholder="Ej: 12345678" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
          </div>

        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          
          <!-- NOMBRES Y APELLIDOS -->
          <div>
            <label class="block text-xs font-bold uppercase text-gray-300 mb-1.5 flex items-center gap-1">
              <span>👤</span> Nombres y Apellidos
            </label>
            <input type="text" id="nombre_apellido" required placeholder="Ej: Pedro Valera" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
          </div>

          <!-- TELÉFONO -->
          <div>
            <label class="block text-xs font-bold uppercase text-gray-300 mb-1.5 flex items-center gap-1">
              <span>📱</span> Teléfono (Contacto / Representante)
            </label>
            <input type="text" id="telefono" placeholder="Ej: 04121234567" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
          </div>

        </div>

        <!-- CAMPO DINÁMICO DE CONTRASEÑA / PIN -->
        <div id="contenedorClave" class="hidden bg-blue-950/40 border border-blue-800/60 p-4 rounded-xl space-y-2 transition-all">
          <label class="block text-xs font-bold uppercase text-blue-300 flex items-center gap-1">
            <span>🔑</span> Crear Contraseña / PIN de Acceso a la App
          </label>
          <input type="password" id="clave" placeholder="Ingrese clave alfanumérica o PIN" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
          <p class="text-[11px] text-gray-400">Esta clave será utilizada por el usuario para acceder al sistema desde el inicio de sesión (`login.html`).</p>
        </div>

        <!-- BOTÓN DE ACCIÓN -->
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-extrabold py-3.5 rounded-xl shadow-lg border border-blue-400/30 transition duration-200 text-sm mt-2 flex justify-center items-center gap-2 cursor-pointer">
          <span>💾</span> Registrar Usuario en Supabase
        </button>

      </form>

      <!-- NOTIFICACIONES DE ESTADO -->
      <div id="mensajeExito" class="hidden text-center text-xs font-bold text-green-400 bg-green-900/40 border border-green-700/60 p-3 rounded-xl">
        ¡Registro procesado y guardado exitosamente en el sistema!
      </div>
      <div id="mensajeError" class="hidden text-center text-xs font-bold text-red-400 bg-red-900/40 border border-red-700/60 p-3 rounded-xl"></div>

    </main>

  </div>

  <!-- PIE DE PÁGINA CORPORATIVO -->
  <footer class="z-10 text-center py-3 w-full border-t border-slate-800/80 bg-slate-900/50 backdrop-blur-sm mt-4">
    <p class="text-xs font-semibold text-gray-400 tracking-wider">
      Desarrollado por <span class="text-blue-400 font-extrabold">DME Technology</span>
    </p>
  </footer>

  <!-- SCRIPT CONEXIÓN SUPABASE Y LÓGICA DINÁMICA -->
  <script>
    const SUPABASE_URL = 'https://dampbjspktpcffqpuiuz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_raLpaXN3c1UpS4mHFvWkTQ_YNbtB3Q5';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // CONTROL VISUAL DEL CAMPO CLAVE
    function evaluarRol(rolSeleccionado) {
      const contenedor = document.getElementById('contenedorClave');
      const inputClave = document.getElementById('clave');

      // Roles operativos y alumnos que NO requieren contraseña de acceso
      const rolesSinClave = ['ESTUDIANTE', 'COCINA', 'OBRERO'];

      if (rolesSinClave.includes(rolSeleccionado)) {
        contenedor.classList.add('hidden');
        inputClave.removeAttribute('required');
        inputClave.value = '';
      } else {
        contenedor.classList.remove('hidden');
        inputClave.setAttribute('required', 'required');
      }
    }

    // REGISTRO GENERAL EN SUPABASE
    async function guardarRegistro(event) {
      event.preventDefault();

      const rol = document.getElementById('rol').value;
      const cedula = document.getElementById('cedula').value.trim();
      const nombre_apellido = document.getElementById('nombre_apellido').value.trim();
      const telefono = document.getElementById('telefono').value.trim();
      const clave = document.getElementById('clave').value.trim();

      const msgExito = document.getElementById('mensajeExito');
      const msgError = document.getElementById('mensajeError');

      msgExito.classList.add('hidden');
      msgError.classList.add('hidden');

      try {
        const payload = {
          rol: rol,
          cedula: cedula,
          nombre_apellido: nombre_apellido,
          telefono: telefono
        };

        // Si el rol seleccionado requiere contraseña, se añade al payload
        if (clave !== '') {
          payload.clave = clave;
        }

        const { data, error } = await supabaseClient
          .from('registro_general')
          .insert([payload]);

        if (error) throw error;

        msgExito.classList.remove('hidden');
        document.getElementById('formRegistro').reset();
        document.getElementById('contenedorClave').classList.add('hidden');

        setTimeout(() => msgExito.classList.add('hidden'), 4000);

      } catch (err) {
        msgError.textContent = "Error al procesar el registro: " + err.message;
        msgError.classList.remove('hidden');
      }
    }
  </script>

</body>
</html>
