<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control - C.E. Guaicaipuro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
  </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col justify-between p-4">

  <!-- ENCABEZADO PANEL -->
  <header class="max-w-4xl w-full mx-auto flex justify-between items-center border-b border-slate-700/80 pb-4 mt-4">
    <div>
      <h1 class="text-xl font-black text-white uppercase tracking-wider">C.E. GUAICAIPURO</h1>
      <p class="text-xs text-blue-400 font-bold uppercase tracking-widest">Panel del Sistema</p>
    </div>
    <button id="logoutBtn" class="bg-red-600/80 hover:bg-red-500 text-white text-xs font-bold px-4 py-2 rounded-xl transition cursor-pointer">
      Cerrar Sesión
    </button>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-4xl w-full mx-auto my-auto bg-slate-800/90 border border-slate-700/80 rounded-3xl p-6 sm:p-8 shadow-2xl text-center space-y-4">
    <div class="w-16 h-16 bg-blue-600/20 text-blue-400 rounded-2xl flex items-center justify-center mx-auto text-2xl font-bold">
      👤
    </div>
    <h2 id="userName" class="text-2xl font-extrabold text-white">Cargando...</h2>
    <p id="userRole" class="text-sm text-blue-400 font-bold uppercase tracking-widest">Verificando rol...</p>
    <p id="userCedula" class="text-xs text-gray-400"></p>

    <div class="pt-6 border-t border-slate-700/80">
      <p class="text-xs text-gray-400">Has iniciado sesión correctamente en el sistema de control de asistencia.</p>
    </div>
  </main>

  <!-- PIE DE PÁGINA -->
  <footer class="text-center py-3 w-full border-t border-slate-800/80 bg-slate-900/80">
    <p class="text-xs font-semibold text-gray-400">
      Desarrollado por <span class="text-blue-400 font-extrabold">DME Technology</span>
    </p>
  </footer>

  <script>
    // Verificar si existe una sesión activa en localStorage
    const usuarioSesion = JSON.parse(localStorage.getItem('currentUser'));

    if (!usuarioSesion) {
      // Si no hay sesión, rebotar al login
      window.location.href = "./index.html";
    } else {
      // Mostrar datos del usuario autenticado
      document.getElementById('userName').textContent = `¡Bienvenido, ${usuarioSesion.nombre_apellido || 'Usuario'}!`;
      document.getElementById('userRole').textContent = `Rol: ${usuarioSesion.rol || 'Sin rol'}`;
      document.getElementById('userCedula').textContent = `Cédula de Identidad: ${usuarioSesion.cedula}`;
    }

    // Botón para cerrar sesión
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('currentUser');
      window.location.href = "./index.html";
    });
  </script>

</body>
</html>
