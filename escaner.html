<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner de Asistencia CEG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <div class="flex justify-between items-center mb-6">
            <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg transition">← Volver al Menú</a>
            <h1 class="text-xl font-bold text-slate-200">Escáner de Asistencia CEG (Producción)</h1>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 flex flex-col items-center">
                <h2 class="text-sm font-semibold text-slate-400 mb-2">CÁMARA DE LECTURA QR</h2>
                <div id="reader" class="w-full rounded-lg overflow-hidden"></div>
                <p id="reader-status" class="text-xs text-slate-500 mt-2">Sincronizando alumnos...</p>
            </div>
            <div class="bg-slate-950 p-6 rounded-xl border border-slate-800 flex flex-col items-center justify-center text-center">
                <h2 class="text-sm font-semibold text-slate-400 mb-4">ESTADO DEL ESCANEO</h2>
                <div id="estado-icono" class="text-6xl mb-3">⏳</div>
                <div id="estado-texto" class="text-lg font-bold text-slate-300">Cargando base de datos...</div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://dampbjspkptpcffqputuz.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhbXBianNwa3B0cGNmZnFwdXR1eiIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzM5MTI2MDM2LCJleHAiOjIwNTQ3MDIwMzZ9.m3s3X57U5sZ4Yh5l7z3f8g9h0j1k2l3m4n5o6p7q8r9";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let html5QrCode;
        let bloqueado = true; // Bloqueado hasta que cargue la lista local
        let listaAlumnos = [];

        function mostrarEstado(mensaje, icono) {
            document.getElementById("estado-icono").innerHTML = icono;
            document.getElementById("estado-texto").innerHTML = mensaje;
        }

        // Descargar la base de datos una sola vez al iniciar para velocidad de 0ms
        async function cargarBaseLocal() {
            try {
                const { data, error } = await _supabase.from('registro_general').select('*');
                if (error) throw error;
                listaAlumnos = data || [];
                bloqueado = false;
                mostrarEstado("Esperando escaneo...", "⚪");
                document.getElementById("reader-statusinnerText") = "Escanee el carnet para registrar el acceso.";
                console.log("Alumnos sincronizados en memoria:", listaAlumnos.length);
            } catch (e) {
                console.error(e);
                mostrarEstado("Error sincronizando base de datos.", "🔴");
            }
        }

        function reiniciarCamara() {
            setTimeout(() => {
                mostrarEstado("Esperando escaneo...", "⚪");
                bloqueado = false;
                if (html5QrCode) {
                    html5QrCode.resume();
                }
            }, 1000); // 1 segundo exacto de espera para la siguiente persona
        }

        // Envío de Telegram en segundo plano (No traba el escáner)
        async function enviarNotificacionTelegram(chatId, nombreAlumno, tipoMovimiento, estadoSemaforo) {
            if (!chatId) return;
            const tokenBot = "TU_TOKEN_DE_TELEGRAM_AQUI"; // Reemplaza con tu token real si aplica
            const horaActual = new Date().toLocaleTimeString();
            const mensaje = `🔔 *C.E. Guaicaipuro - Control de Asistencia*\n\nEstimado Representante, le informamos que el alumno *${nombreAlumno}* ha registrado su *${tipoMovimiento}* (${estadoSemaforo}) a las ${horaActual}.`;
            
            try {
                await fetch(`https://api.telegram.org/bot${tokenBot}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: mensaje,
                        parse_mode: 'Markdown'
                    })
                });
            } catch (e) {
                console.warn("Telegram no enviado:", e);
            }
        }

        async function alDetectarQR(codigoEscaneado) {
            if (bloqueado) return;
            bloqueado = true;

            html5QrCode.pause(true);
            mostrarEstado("Verificando...", "🟡");

            // Limpieza absoluta de la cédula del QR (elimina espacios y letras sobrantes)
            const raw = codigoEscaneado.trim();
            const soloNumerosBuscado = raw.replace(/\D/g, '');

            // Búsqueda instantánea en la memoria local (0 milisegundos)
            const usuario = listaAlumnos.find(u => {
                if (!u.cedula) return false;
                const cedulaBdNumeros = String(u.cedula).replace(/\D/g, '');
                return cedulaBdNumeros === soloNumerosBuscado;
            });

            if (!usuario) {
                mostrarEstado(`Cédula ${raw} no registrada.`, "🔴");
                reiniciarCamara();
                return;
            }

            const ahora = new Date();
            const horaDecimal = ahora.getHours() + (ahora.getMinutes() / 60);
            let tipoMovimiento = (horaDecimal >= 11.5 && horaDecimal <= 13.5) ? "SALIDA" : "ENTRADA";
            let estadoSemaforo = "🟢 A TIEMPO";

            const inicioHoy = new Date();
            inicioHoy.setHours(0, 0, 0, 0);

            try {
                // Verificar duplicados hoy en Supabase
                const { data: reg } = await _supabase
                    .from('asistencia')
                    .select('id')
                    .eq('cedula', usuario.cedula)
                    .eq('tipo_movimiento', tipoMovimiento)
                    .gte('fecha_hora', inicioHoy.toISOString())
                    .limit(1);

                if (reg && reg.length > 0) {
                    mostrarEstado(`${usuario.nombre_apellido}<br><span class="text-amber-400 text-sm">⚠️ Ya registró su ${tipoMovimiento} hoy</span>`, "🟡");
                    reiniciarCamara();
                    return;
                }

                // Insertar asistencia de forma inmediata
                const { error: errInsert } = await _supabase.from('asistencia').insert([{
                    nombre_apellido: usuario.nombre_apellido,
                    cedula: usuario.cedula,
                    tipo_movimiento: tipoMovimiento,
                    estado_asistencia: estadoSemaforo,
                    fecha_hora: ahora.toISOString()
                }]);

                if (errInsert) {
                    mostrarEstado("Error al guardar asistencia.", "🔴");
                } else {
                    mostrarEstado(`${usuario.nombre_apellido}<br><span class="text-emerald-400 text-sm">${tipoMovimiento} - ${estadoSemaforo}</span>`, "🟢");
                    
                    // Notificar a Telegram de forma asíncrona en segundo plano
                    enviarNotificacionTelegram(usuario.telegram_chat_id, usuario.nombre_apellido, tipoMovimiento, estadoSemaforo);
                }
            } catch (e) {
                console.error(e);
                mostrarEstado("Error procesando acceso.", "🔴");
            }
            reiniciarCamara();
        }

        window.addEventListener('load', async () => {
            await cargarBaseLocal();
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 20, qrbox: { width: 250, height: 250 } },
                (decodedText) => alDetectarQR(decodedText),
                (errorMessage) => {}
            ).catch(err => {
                console.error("Error cámara", err);
                mostrarEstado("Error al iniciar la cámara.", "🔴");
            });
        });
    </script>
</body>
</html>
