<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner de Asistencia CEG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <div class="flex justify-between items-center mb-6">
            <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg transition">← Volver al Menú</a>
            <h1 class="text-xl font-bold text-slate-200">Escáner de Asistencia CEG</h1>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 flex flex-col items-center">
                <h2 class="text-sm font-semibold text-slate-400 mb-2">CÁMARA DE LECTURA QR</h2>
                <div id="reader" class="w-full rounded-lg overflow-hidden"></div>
                <p id="reader-status" class="text-xs text-slate-500 mt-2">Escanee el carnet para registrar el acceso.</p>
            </div>
            <div class="bg-slate-950 p-6 rounded-xl border border-slate-800 flex flex-col items-center justify-center text-center">
                <h2 class="text-sm font-semibold text-slate-400 mb-4">ESTADO DEL ESCANEO</h2>
                <div id="estado-icono" class="text-6xl mb-3">⚪</div>
                <div id="estado-texto" class="text-lg font-bold text-slate-300">Esperando escaneo...</div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://dampbjspkptpcffqputuz.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhbXBianNwa3B0cGNmZnFwdXR1eiIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzM5MTI2MDM2LCJleHAiOjIwNTQ3MDIwMzZ9.m3s3X57U5sZ4Yh5l7z3f8g9h0j1k2l3m4n5o6p7q8r9";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let html5QrCode;
        let bloqueado = false;

        function mostrarEstado(mensaje, icono) {
            document.getElementById("estado-icono").innerHTML = icono;
            document.getElementById("estado-texto").innerHTML = mensaje;
        }

        function reiniciarCamara() {
            setTimeout(() => {
                mostrarEstado("Esperando escaneo...", "⚪");
                bloqueado = false;
                if (html5QrCode) {
                    html5QrCode.resume();
                }
            }, 1200); // 1.2 segundos para lectura ultra fluida de 1000 personas
        }

        async function alDetectarQR(codigoEscaneado) {
            if (bloqueado) return;
            bloqueado = true;

            html5QrCode.pause(true);
            mostrarEstado("Verificando...", "🟡");

            // Limpieza radical de la cédula leída por el QR
            const raw = codigoEscaneado.trim();
            const soloNumeros = raw.replace(/\D/g, '');
            const cedulaConV = `V-${soloNumeros}`;

            try {
                // Consultamos directamente por partes para garantizar que caiga en la cédula correcta
                let usuario = null;

                // 1. Intentar buscar por formato exacto V-XXXXXXX
                let res1 = await _supabase.from('registro_general').select('*').eq('cedula', cedulaConV).maybeSingle();
                if (res1.data) {
                    usuario = res1.data;
                } else {
                    // 2. Intentar buscar por solo números
                    let res2 = await _supabase.from('registro_general').select('*').eq('cedula', soloNumeros).maybeSingle();
                    if (res2.data) {
                        usuario = res2.data;
                    } else {
                        // 3. Intentar buscar por el texto crudo exacto
                        let res3 = await _supabase.from('registro_general').select('*').eq('cedula', raw).maybeSingle();
                        if (res3.data) usuario = res3.data;
                    }
                }

                if (!usuario) {
                    mostrarEstado(`Cédula ${raw} no registrada.`, "🔴");
                    reiniciarCamara();
                    return;
                }

                const ahora = new Date();
                const horaDecimal = ahora.getHours() + (ahora.getMinutes() / 60);
                let tipoMovimiento = (horaDecimal >= 11.5 && horaDecimal <= 13.5) ? "SALIDA" : "ENTRADA";
                let estadoSemaforo = "🟢 A TIEMPO";

                const inicioHoy = new Date();
                inicioHoy.setHours(0, 0, 0, 0);

                // Validar duplicados hoy
                const { data: reg } = await _supabase
                    .from('asistencia')
                    .select('id')
                    .eq('cedula', usuario.cedula)
                    .eq('tipo_movimiento', tipoMovimiento)
                    .gte('fecha_hora', inicioHoy.toISOString())
                    .limit(1);

                if (reg && reg.length > 0) {
                    mostrarEstado(`${usuario.nombre_apellido}<br><span class="text-amber-400 text-sm">⚠️ Ya registró su ${tipoMovimiento} hoy</span>`, "🟡");
                    reiniciarCamara();
                    return;
                }

                // Insertar asistencia
                await _supabase.from('asistencia').insert([{
                    nombre_apellido: usuario.nombre_apellido,
                    cedula: usuario.cedula,
                    tipo_movimiento: tipoMovimiento,
                    estado_asistencia: estadoSemaforo,
                    fecha_hora: ahora.toISOString()
                }]);

                mostrarEstado(`${usuario.nombre_apellido}<br><span class="text-emerald-400 text-sm">${tipoMovimiento} - ${estadoSemaforo}</span>`, "🟢");
            } catch (e) {
                console.error(e);
                mostrarEstado("Error procesando.", "🔴");
            }
            reiniciarCamara();
        }

        window.addEventListener('load', () => {
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 20, qrbox: { width: 250, height: 250 } },
                (decodedText) => alDetectarQR(decodedText),
                (errorMessage) => {}
            ).catch(err => {
                console.error("Error cámara", err);
            });
        });
    </script>
</body>
</html>
